name: platform-assurance

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build

      - name: Run machine-readable product assurance gate
        run: python scripts/product_assurance_gate.py --full --output "$RUNNER_TEMP/product-assurance.json"

      - name: Build and qualify installed distributions
        run: python scripts/release_distribution.py "$RUNNER_TEMP/research-distribution"

      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-assurance-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/product-assurance.json
            ${{ runner.temp }}/research-distribution/**
