[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-platform"
version = "0.43.1"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
research = "research_platform.operator.composition.research:main"
research-platform-architecture-gate = "research_platform.governance.architecture.gate:main"
research-platform-manage = "research_platform.operator.maintenance.runtime.management_cli:main"
research-platform-algorithm = "research_platform.governance.algorithm.cli:main"
research-platform-concurrency = "research_platform.governance.concurrency.cli:main"
research-platform-performance = "research_platform.governance.performance.cli:main"
research-platform-repository-boundary = "research_platform.governance.repository_boundary.cli:main"

[tool.setuptools.packages.find]
include = ["research_platform*"]

[tool.setuptools.package-data]
"research_platform.governance.system_registry" = ["catalog.json"]
"research_platform.environment.minecraft.providers" = ["assets/mineflayer_bridge/*.js", "assets/mineflayer_bridge/package.json", "assets/mineflayer_bridge/package-lock.json"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
