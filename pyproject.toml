[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noetrium"
version = "0.43.1"
description = "Reproducible Research Infrastructure for AI Agents"
readme = "README.md"
keywords = ["ai-agents", "agent-research", "research-infrastructure", "reproducibility", "experiment-management", "multi-agent-systems", "agent-evaluation", "ai-infrastructure", "evidence", "scientific-computing"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/SDFGAEV/noetrium"
Repository = "https://github.com/SDFGAEV/noetrium"
Documentation = "https://github.com/SDFGAEV/noetrium/tree/master/docs"
Examples = "https://github.com/SDFGAEV/noetrium/tree/master/examples"
Issues = "https://github.com/SDFGAEV/noetrium/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
evoctl-next = "research_platform.operator.composition.cli:main"
research-platform-architecture-gate = "research_platform.governance.architecture.gate:main"
research-platform-manage = "research_platform.operator.maintenance.runtime.management_cli:main"
research-platform-algorithm = "research_platform.governance.algorithm.cli:main"
research-platform-concurrency = "research_platform.governance.concurrency.cli:main"
research-platform-performance = "research_platform.governance.performance.cli:main"
research-platform-repository-boundary = "research_platform.governance.repository_boundary.cli:main"

[tool.setuptools.packages.find]
include = ["research_platform*"]

[tool.setuptools.package-data]
"research_platform.governance.system_registry" = ["catalog.json"]
"research_platform.environment.minecraft.providers" = ["assets/mineflayer_bridge/*.js", "assets/mineflayer_bridge/package.json", "assets/mineflayer_bridge/package-lock.json"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
